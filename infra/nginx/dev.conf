# Dev routing: two hosts, /api on both goes to the API (D3). The apps run on the
# host, so upstreams point at host.docker.internal. *.localhost resolves to
# loopback in browsers and curl without any hosts-file change.

upstream frontend_public {
    server host.docker.internal:3000;
}

upstream frontend_internal {
    server host.docker.internal:3001;
}

upstream api {
    server host.docker.internal:4000;
}

# Next.js dev HMR uses WebSockets.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Any other host, and the container health check.
server {
    listen 80 default_server;
    server_name _;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name learn.localhost;

    location /api/ {
        proxy_pass http://api;
        include /etc/nginx/conf.d/proxy.inc;
    }

    location / {
        proxy_pass http://frontend_public;
        include /etc/nginx/conf.d/proxy.inc;
    }
}

server {
    listen 80;
    server_name admin.localhost;

    location /api/ {
        proxy_pass http://api;
        include /etc/nginx/conf.d/proxy.inc;
    }

    location / {
        proxy_pass http://frontend_internal;
        include /etc/nginx/conf.d/proxy.inc;
    }
}
