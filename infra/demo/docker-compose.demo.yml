name: wsap-demo

x-app: &app
  env_file:
    - ./.env
  restart: unless-stopped

x-data-volumes: &data-volumes
  - uploads:/srv/heat/uploads
  - hls:/srv/heat/hls
  - media:/srv/heat/media
  - certificates:/srv/heat/certificates

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy infra/demo/.env.example to infra/demo/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy infra/demo/.env.example to infra/demo/.env}
      POSTGRES_DB: ${POSTGRES_DB:?copy infra/demo/.env.example to infra/demo/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8035}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  init-data:
    image: busybox:1.37
    restart: "no"
    command: ["chown", "-R", "1000:1000", "/srv/heat"]
    volumes: *data-volumes

  migrate:
    <<: *app
    build:
      context: ../..
      dockerfile: infra/prod/Dockerfile
      target: migrate
    restart: "no"
    environment:
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    build:
      context: ../..
      dockerfile: infra/prod/Dockerfile
      target: api
    environment:
      NODE_ENV: development
      PORT: "4000"
    volumes: *data-volumes
    depends_on:
      init-data:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4000/api/health').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *app
    build:
      context: ../..
      dockerfile: infra/prod/Dockerfile
      target: worker
    environment:
      NODE_ENV: development
    volumes: *data-volumes
    depends_on:
      init-data:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  frontend-public:
    <<: *app
    build:
      context: ../..
      dockerfile: infra/prod/Dockerfile
      target: frontend
      args:
        APP: frontend-public
    environment:
      PORT: "3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.status<500?0:1),()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend-internal:
    <<: *app
    build:
      context: ../..
      dockerfile: infra/prod/Dockerfile
      target: frontend
      args:
        APP: frontend-internal
    environment:
      PORT: "3001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/').then((r)=>process.exit(r.status<500?0:1),()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-80}:80"
    environment:
      HLS_SIGNING_KEYS: ${HLS_SIGNING_KEYS:?copy infra/demo/.env.example to infra/demo/.env}
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/demo.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/proxy.inc:/etc/nginx/conf.d/proxy.inc:ro
      - ../nginx/hls.inc:/etc/nginx/conf.d/hls.inc:ro
      - ../nginx/certificates.inc:/etc/nginx/conf.d/certificates.inc:ro
      - ../nginx/media.inc:/etc/nginx/conf.d/media.inc:ro
      - ../nginx/hls.js:/etc/nginx/njs/hls.js:ro
      - ../nginx/hls-verify.js:/etc/nginx/njs/hls-verify.js:ro
      - ../nginx/media.js:/etc/nginx/njs/media.js:ro
      - ../nginx/media-verify.js:/etc/nginx/njs/media-verify.js:ro
      - hls:/srv/media/hls:ro
      - certificates:/srv/certificates:ro
      - media:/srv/mediastore:ro
    depends_on:
      api:
        condition: service_healthy
      frontend-public:
        condition: service_healthy
      frontend-internal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  uploads:
  hls:
  media:
  certificates:
