# Local dev services. The apps run on the host (`pnpm dev`); Nginx reaches them
# through host.docker.internal. Start with `pnpm dev:up`.
name: heat-lms-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?run pnpm dev:up}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run pnpm dev:up}
      POSTGRES_DB: ${POSTGRES_DB:?run pnpm dev:up}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?run pnpm dev:up}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # BullMQ needs noeviction: Redis must never drop queue keys under memory pressure.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:?run pnpm dev:up}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches all outgoing mail. SMTP and web UI ports come from .env (defaults 1035 and 8035).
  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:?run pnpm dev:up}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:?run pnpm dev:up}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:?run pnpm dev:up}:80"
    volumes:
      - ../nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/proxy.inc:/etc/nginx/conf.d/proxy.inc:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
