name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { task: lint, command: pnpm lint }
          - { task: format, command: pnpm format:check }
          - { task: typecheck, command: pnpm typecheck }
          - { task: test, command: pnpm test:coverage }
          - { task: build, command: pnpm build }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ matrix.task }}-${{ github.sha }}
          restore-keys: turbo-${{ matrix.task }}-
      - run: ${{ matrix.command }}
        env:
          TURBO_CACHE_DIR: .turbo

  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm -r --if-present run test:integration

  storybook:
    name: storybook
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @heat/ui exec playwright install --with-deps chromium
      - run: pnpm --filter @heat/ui build-storybook
      - run: pnpm --filter @heat/ui test:stories
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: storybook-static
          path: packages/ui/storybook-static
          retention-days: 7

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter frontend-public exec playwright install --with-deps chromium
      - run: pnpm turbo run test:e2e --filter=frontend-public
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/frontend-public/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  api-client-drift:
    name: api-client-drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm generate --force
      - name: Fail when the generated files changed
        run: |
          paths="apps/api/openapi.json packages/api-client/src/generated"
          changed=$(git status --porcelain --untracked-files=all -- $paths)
          if [ -n "$changed" ]; then
            echo "::error title=Generated API client is out of date::Run pnpm generate and commit the result."
            echo "Changed generated files (M modified, D deleted, ?? new):"
            echo "$changed"
            git diff --stat -- $paths
            exit 1
          fi
          echo "Generated files are up to date."
