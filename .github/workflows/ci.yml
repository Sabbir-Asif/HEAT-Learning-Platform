name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { task: lint, command: pnpm lint }
          - { task: format, command: pnpm format:check }
          - { task: typecheck, command: pnpm typecheck }
          - { task: test, command: pnpm test:coverage }
          - { task: build, command: pnpm build }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .turbo
          key: turbo-${{ matrix.task }}-${{ github.sha }}
          restore-keys: turbo-${{ matrix.task }}-
      - run: ${{ matrix.command }}
        env:
          TURBO_CACHE_DIR: .turbo

  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm turbo build --filter=api... --filter=@heat/db...
        env:
          TURBO_CACHE_DIR: .turbo
      - run: pnpm -r --if-present run test:integration

  migrations:
    name: migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: heat
          POSTGRES_PASSWORD: heat
          POSTGRES_DB: heat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://heat:heat@localhost:5432/heat
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: node packages/config/bin/migrations.mjs immutable "$BASE_REF"
      - run: pnpm --filter @heat/db exec prisma migrate deploy
      - run: pnpm --filter @heat/db exec prisma migrate diff --from-config-datasource --to-schema prisma/schema --exit-code

  storybook:
    name: storybook
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @heat/ui exec playwright install --with-deps chromium
      - run: pnpm --filter @heat/ui build-storybook
      - run: pnpm --filter @heat/ui test:stories
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: storybook-static
          path: packages/ui/storybook-static
          retention-days: 7

  api-client-drift:
    name: api-client-drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm generate --force
      - name: Fail when the generated files changed
        run: |
          paths="apps/api/openapi.json packages/api-client/src/generated"
          changed=$(git status --porcelain --untracked-files=all -- $paths)
          if [ -n "$changed" ]; then
            echo "::error title=Generated API client is out of date::Run pnpm generate and commit the result."
            echo "Changed generated files (M modified, D deleted, ?? new):"
            echo "$changed"
            git diff --stat -- $paths
            exit 1
          fi
          echo "Generated files are up to date."

  screenshots:
    name: screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - id: run
        continue-on-error: true
        run: node packages/e2e/bin/docker.mjs visual
      - if: ${{ !cancelled() }}
        run: node packages/e2e/bin/report-visual.mjs
        env:
          RUN_OUTCOME: ${{ steps.run.outcome }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: screenshot-diffs
          path: packages/e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @heat/e2e exec playwright install --with-deps chromium
      - run: pnpm turbo build --filter=frontend-public
        env:
          TURBO_CACHE_DIR: .turbo
      - id: audit
        continue-on-error: true
        run: pnpm --filter @heat/e2e lighthouse
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-reports
          path: packages/e2e/lighthouse-results
          retention-days: 7
          if-no-files-found: ignore
      - if: ${{ !cancelled() }}
        run: pnpm --filter @heat/e2e lighthouse:report
        env:
          RUN_OUTCOME: ${{ steps.audit.outcome }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
