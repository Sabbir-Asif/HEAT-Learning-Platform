version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Majors are moved by hand: @types/node follows the Node runtime (22), and
      # TypeScript 7 is a new compiler the rest of the toolchain does not support yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directory: /infra/compose
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Persisted volumes cannot jump a major version; upgrade those by hand.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: redis
        update-types: ["version-update:semver-major"]
