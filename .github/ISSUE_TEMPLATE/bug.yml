name: "Bug"
description: "Something that does not work as specified"
labels: ["type:bug", "needs-refinement"]
body:
  - type: markdown
    attributes:
      value: "Do not paste passwords, tokens or personal data (names, emails, student IDs). Redact logs and screenshots first."
  - type: textarea
    id: context
    attributes:
      label: "Context and reproduction"
      description: "What happens, what should happen, steps to reproduce, and where (app, browser, version)."
      placeholder: "Steps: 1. ... Expected: ... Actual: ..."
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: One checkbox per criterion, each in Given, When, Then form.
      value: |
        - [ ] Given ..., when ..., then ...
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this ticket does not do.
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: 'Tickets that must land first, as "Blocked by #N". Write "None" if there are none.'
      placeholder: "Blocked by #12"
    validations:
      required: true
  - type: textarea
    id: test-plan
    attributes:
      label: Test plan
      description: The tests to write and the checks to run, starting with the failing test.
    validations:
      required: true
  - type: textarea
    id: security-notes
    attributes:
      label: Security notes
      description: 'Auth, permissions, uploads, personal data and secrets this touches, and how they are handled. Write "None" if it touches none.'
    validations:
      required: true
  - type: checkboxes
    id: definition-of-done
    attributes:
      label: Definition of done
      options:
        - label: Acceptance criteria met and demonstrated in the pull request
        - label: Tests from the test plan added and passing in CI
        - label: Lint, typecheck and build pass
        - label: Security, privacy and accessibility points above handled
        - label: Docs or ADR updated where behaviour or a decision changed
        - label: Merged by the owner after green CI
