packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: false
  "@scarf/scarf": false

catalog:
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  next: 16.4.5
  babel-plugin-react-compiler: 1.0.0
  typescript: 5.9.3
  vitest: 5.1.0
  "@types/node": ^22.19.0
  zod: 4.6.7
  eslint: 10.14.0
  prettier: 3.9.10
  eslint-config-next: 16.4.5
  "@vitest/coverage-v8": 5.1.0
  "@vitest/browser-playwright": 5.1.0
  vite: 8.3.6
  tailwindcss: 4.3.3
  "@tailwindcss/vite": 4.3.3
  "@tailwindcss/postcss": 4.3.3

minimumReleaseAgeExclude:
  - "@nestjs/cli@12.0.12"
  - "@nestjs/common@12.4.0"
  - "@nestjs/core@12.4.0"
  - "@nestjs/platform-express@12.4.0"
  - "@nestjs/schematics@12.0.13"
