<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WSAP LMS prototype</title>
<style>
:root{--bar:#2b1850;--ink:#fff;--accent:#f2b35e;--bg:#e9e5f2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font:14px/1.4 system-ui,sans-serif;color:#1d1530}
header{position:sticky;top:0;z-index:10;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--bar);color:var(--ink)}
header button,header select{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid #6b5a96;background:#432a74;color:var(--ink);cursor:pointer}
header button[aria-pressed=true]{background:var(--accent);color:#2b1850;border-color:var(--accent)}
header button:focus-visible,header select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header .grow{flex:1}
header small{opacity:.75}
main{display:flex;justify-content:center;padding:24px 16px 64px}
.stage{position:relative;width:100%;max-width:1440px;box-shadow:0 4px 24px rgba(43,24,80,.25);background:#fff}
.stage.phone{max-width:390px}
.stage img{display:block;width:100%;height:auto}
.spot{position:absolute;display:block;border-radius:8px;cursor:pointer}
.spot:focus-visible{outline:3px solid var(--accent)}
.show .spot{background:rgba(242,179,94,.35);outline:2px solid var(--accent)}
</style>
</head>
<body>
<header>
<button id="back" type="button">Back</button>
<select id="screen" aria-label="Screen"></select>
<span class="grow"></span>
<button id="dev-L" type="button" aria-pressed="true">Laptop</button>
<button id="dev-P" type="button" aria-pressed="false">Phone</button>
<button id="hint" type="button" aria-pressed="false">Show clickable areas</button>
</header>
<main><div id="stage" class="stage"></div></main>

let dev = "L";
let stem = "student-landing";
const history = [];
const stage = document.getElementById("stage");
const select = document.getElementById("screen");

for (const [name, stems] of GROUPS) {
  const group = document.createElement("optgroup");
  group.label = name;
  for (const s of stems) {
    if (!SCREENS[s]) continue;
    const option = document.createElement("option");
    option.value = s;
    option.textContent = TITLES[s];
    group.appendChild(option);
  }
  select.appendChild(group);
}

function pick(s) {
  const entry = SCREENS[s];
  if (!entry) return null;
  if (entry[dev]) return entry[dev];
  const other = dev === "L" ? "P" : "L";
  return entry[other] || null;
}

function render(push) {
  const entry = pick(stem);
  if (!entry) return;
  const isPhone = !SCREENS[stem][dev] ? dev === "L" : dev === "P";
  stage.className = "stage" + (isPhone ? " phone" : "") + (document.getElementById("hint").getAttribute("aria-pressed") === "true" ? " show" : "");
  stage.replaceChildren();
  const img = document.createElement("img");
  img.src = "../exports/" + entry.file.replace(/\.png$/, "-light-en.png");
  img.alt = TITLES[stem];
  stage.appendChild(img);
  for (const spot of entry.spots) {
    if (!pick(spot.to)) continue;
    const a = document.createElement("a");
    a.className = "spot";
    a.href = "#" + spot.to;
    a.style.left = (spot.x / entry.w * 100) + "%";
    a.style.top = (spot.y / entry.h * 100) + "%";
    a.style.width = (spot.w / entry.w * 100) + "%";
    a.style.height = (spot.h / entry.h * 100) + "%";
    a.setAttribute("aria-label", "Go to " + TITLES[spot.to]);
    a.addEventListener("click", (event) => {
      event.preventDefault();
      go(spot.to);
    });
    stage.appendChild(a);
  }
  select.value = stem;
  document.getElementById("dev-L").setAttribute("aria-pressed", String(dev === "L"));
  document.getElementById("dev-P").setAttribute("aria-pressed", String(dev === "P"));
  window.scrollTo(0, 0);
  try { location.hash = stem + "/" + dev; } catch (error) { void error; }
}

function go(target) {
  history.push(stem);
  stem = target;
  render();
}

document.getElementById("back").addEventListener("click", () => {
  const prev = history.pop();
  if (prev) { stem = prev; render(); }
});
select.addEventListener("change", () => { history.push(stem); stem = select.value; render(); });
document.getElementById("dev-L").addEventListener("click", () => { dev = "L"; render(); });
document.getElementById("dev-P").addEventListener("click", () => { dev = "P"; render(); });
document.getElementById("hint").addEventListener("click", (event) => {
  const on = event.currentTarget.getAttribute("aria-pressed") !== "true";
  event.currentTarget.setAttribute("aria-pressed", String(on));
  stage.classList.toggle("show", on);
});
document.addEventListener("keydown", (event) => {
  if (event.key === "h" && !(event.target instanceof HTMLSelectElement)) document.getElementById("hint").click();
});

const start = location.hash.replace("#", "").split("/");
if (start[0] && SCREENS[start[0]]) stem = start[0];
if (start[1] === "P" || start[1] === "L") dev = start[1];
render();
